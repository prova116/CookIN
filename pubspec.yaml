name: cookin
description: CookIN - a home-chef food ordering app built with Flutter.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Pinned: 1.5.x requires Flutter 3.27+ (Color.withValues).
  otp_pin_field: 1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/img/

  fonts:
    - family: Metropolis
      fonts:
        - asset: assets/font/metropolis.regular.otf
          weight: 400
        - asset: assets/font/metropolis.medium.otf
          weight: 500
        - asset: assets/font/metropolis.semi-bold.otf
          weight: 600
        - asset: assets/font/metropolis.bold.otf
          weight: 700
        - asset: assets/font/metropolis.extra-bold.otf
          weight: 800
